name: Verify and publish Jay's World
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_browser_validation:
        description: Optionally run the complete browser suite before publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Cache Chromium for optional browser validation
        if: ${{ inputs.full_browser_validation }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Chromium for optional browser validation
        if: ${{ inputs.full_browser_validation }}
        run: npx playwright install --with-deps chromium
      - name: Run the complete visitor suite
        if: ${{ inputs.full_browser_validation }}
        run: npm run test:browser
      - name: Keep optional browser diagnostics
        if: ${{ always() && inputs.full_browser_validation }}
        uses: actions/upload-artifact@v4
        with:
          name: visitor-checks-${{ github.run_attempt }}
          path: qa/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
