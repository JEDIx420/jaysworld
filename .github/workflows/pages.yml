name: Check and publish Jay's World
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_browser_validation:
        description: Run every desktop, touch, media and fallback journey
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    name: Build, physics and browser checks ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      JAYSWORLD_QA_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Check driving, every room, phone screens and traffic
        if: ${{ !inputs.full_browser_validation }}
        env:
          JAYSWORLD_QA_FILTER: desktop keyboard driving|seven short exhibits|computer centre|traffic lane motion|road-first welcome|sportsbike|amphitheatre
        run: npm run test:browser
      - name: Run the complete visitor suite
        if: ${{ inputs.full_browser_validation }}
        run: npm run test:browser
      - name: Keep browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visitor-checks-${{ matrix.shard }}
          path: qa/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: ${{ matrix.shard == 1 }}
        with:
          path: dist
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
