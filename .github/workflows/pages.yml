name: Check and publish Jay's World
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser for visitor checks
        run: npx playwright install --with-deps chromium
      - name: Check the production visitor journey
        run: npm run test:browser
      - name: Keep browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visitor-checks
          path: qa/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Jay enables Pages himself. A push checks the build; Run workflow publishes it.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
